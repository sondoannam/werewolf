version: "3.8"

services:
  # Base Data Layer
  postgres:
    image: postgres:16-alpine
    container_name: moonfall_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: moonfall_redis
    restart: always
    ports:
      - "6379:6379"

  # Realtime Media Layer
  livekit:
    image: livekit/livekit-server:latest
    container_name: moonfall_livekit
    command: --config /livekit.yaml --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/livekit.yaml
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_KEYS}

volumes:
  postgres_data:
